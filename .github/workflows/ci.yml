name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      LEFTHOOK: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm

      - run: rustup show active-toolchain || rustup toolchain install

      - run: npm ci

      - run: npm run lint

  test:
    strategy:
      fail-fast: false
      matrix:
        os: ${{ github.event_name == 'pull_request' && fromJSON('["ubuntu-latest","windows-latest"]') || fromJSON('["ubuntu-latest","macos-latest","windows-latest"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      LEFTHOOK: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm

      - run: rustup show active-toolchain || rustup toolchain install

      - run: cargo install wasm-bindgen-cli@0.2.129

      - run: npm ci

      - run: npm run build:wasm

      - run: npm run build:oauth-wasm

      - run: npm test

  reproducible-wasm:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      LEFTHOOK: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm

      - run: rustup show active-toolchain || rustup toolchain install

      - run: cargo install wasm-bindgen-cli@0.2.129

      - run: npm ci

      - name: Build jerk-oauth wasm (first)
        run: |
          npm run build:oauth-wasm
          mkdir -p /tmp/build-a
          cp dist/jerk-oauth/jerk_oauth_wasm_bg.wasm /tmp/build-a/
          cp dist/jerk-oauth/jerk_oauth_wasm.js /tmp/build-a/
          cp dist/jerk-oauth/jerk_oauth_wasm.d.ts /tmp/build-a/

      - name: Build jerk-oauth wasm (second)
        run: |
          cargo clean -p jerk-oauth-wasm
          npm run build:oauth-wasm
          mkdir -p /tmp/build-b
          cp dist/jerk-oauth/jerk_oauth_wasm_bg.wasm /tmp/build-b/
          cp dist/jerk-oauth/jerk_oauth_wasm.js /tmp/build-b/
          cp dist/jerk-oauth/jerk_oauth_wasm.d.ts /tmp/build-b/

      - name: Compare builds
        run: |
          diff /tmp/build-a/jerk_oauth_wasm_bg.wasm /tmp/build-b/jerk_oauth_wasm_bg.wasm
          diff /tmp/build-a/jerk_oauth_wasm.js /tmp/build-b/jerk_oauth_wasm.js
          diff /tmp/build-a/jerk_oauth_wasm.d.ts /tmp/build-b/jerk_oauth_wasm.d.ts
          echo "All jerk-oauth wasm artifacts are byte-identical across builds"

  test-installer:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      LEFTHOOK: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Create fake assets
        run: |
          mkdir -p _test_assets
          arch=$(uname -m)
          case "$arch" in x86_64|amd64) arch=amd64 ;; arm64|aarch64) arch=arm64 ;; esac
          asset="jerk-linux-${arch}"
          printf '#!/bin/sh\nprintf "jerk 0.99.0\\n"\n' > "_test_assets/$asset"
          chmod +x "_test_assets/$asset"
          hash=$(sha256sum "_test_assets/$asset" | cut -d' ' -f1)
          printf '%s  %s\n' "$hash" "$asset" > _test_assets/SHA256SUMS

      - name: Run installer tests
        run: FAKE_VERSION=0.99.0 sh scripts/test-install.sh _test_assets

  test-installer-macos:
    if: github.event_name != 'pull_request'
    runs-on: macos-latest
    timeout-minutes: 10
    env:
      LEFTHOOK: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Create fake assets
        run: |
          mkdir -p _test_assets
          os=$(uname -s | tr '[:upper:]' '[:lower:]')
          case "$(uname -m)" in x86_64|amd64) arch=amd64 ;; arm64|aarch64) arch=arm64 ;; esac
          asset="jerk-${os}-${arch}"
          printf '#!/bin/sh\nprintf "jerk 0.99.0\\n"\n' > "_test_assets/$asset"
          chmod +x "_test_assets/$asset"
          hash=$(shasum -a 256 "_test_assets/$asset" | cut -d' ' -f1)
          printf '%s  %s\n' "$hash" "$asset" > _test_assets/SHA256SUMS

      - name: Run installer tests
        run: FAKE_VERSION=0.99.0 sh scripts/test-install.sh _test_assets

  test-installer-alpine:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      LEFTHOOK: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Create fake assets
        run: |
          mkdir -p _test_assets
          arch=$(uname -m)
          case "$arch" in x86_64|amd64) arch=amd64 ;; arm64|aarch64) arch=arm64 ;; esac
          asset="jerk-linux-${arch}"
          printf '#!/bin/sh\nprintf "jerk 0.99.0\\n"\n' > "_test_assets/$asset"
          chmod +x "_test_assets/$asset"
          hash=$(sha256sum "_test_assets/$asset" | cut -d' ' -f1)
          printf '%s  %s\n' "$hash" "$asset" > _test_assets/SHA256SUMS

      - name: Run installer tests in alpine (wget only)
        run: |
          docker run --rm -v "$PWD:/w" alpine:latest sh -c '
            apk add --no-cache python3 coreutils
            apk del curl 2>/dev/null || true
            FAKE_VERSION=0.99.0 sh /w/scripts/test-install.sh /w/_test_assets
          '
