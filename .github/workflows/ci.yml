name: CI

on:
  pull_request:
  merge_group:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  runner:
    runs-on: ${{ vars.CERT_LIGHT_RUNNER || vars.CERT_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      runner: ${{ steps.pick.outputs.runner }}
    steps:
      - id: pick
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        env:
          FORCED: ${{ vars.CI_RUNNER }}
          POOL: ${{ vars.CERT_RUNNER || 'cloud-run-bench' }}
        with:
          script: |
            const hosted = 'ubuntu-latest';
            const pick = async (runner, why) => {
              core.setOutput('runner', runner);
              await core.summary.addRaw(`runner: ${runner} (${why})\n`).write();
            };
            if (process.env.FORCED) return await pick(process.env.FORCED, 'vars.CI_RUNNER');
            const pool = process.env.POOL;
            const { owner, repo } = context.repo;
            if (context.eventName === 'pull_request') {
              const head = context.payload.pull_request.head.repo;
              const same = head && head.full_name === `${owner}/${repo}`;
              return same ? await pick(pool, 'same-repo PR') : await pick(hosted, 'fork PR');
            }
            if (context.eventName === 'merge_group') {
              const base = context.payload.merge_group.base_ref.replace('refs/heads/', '');
              const q = await github.graphql(
                `query($o:String!,$n:String!,$b:String!){repository(owner:$o,name:$n){mergeQueue(branch:$b){entries(first:100){nodes{pullRequest{number isCrossRepository}}}}}}`,
                { o: owner, n: repo, b: base }
              );
              const entries = q.repository.mergeQueue?.entries?.nodes ?? [];
              const forks = entries.filter((e) => e.pullRequest?.isCrossRepository !== false);
              return forks.length === 0
                ? await pick(pool, `merge group, ${entries.length} same-repo entries`)
                : await pick(hosted, `merge group with a fork or unknown PR: ${forks.map((e) => e.pullRequest?.number).join(', ')}`);
            }
            await pick(hosted, context.eventName);

  lint:
    needs: runner
    runs-on: ${{ needs.runner.outputs.runner }}
    timeout-minutes: 15
    env:
      LEFTHOOK: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm

      - uses: ./.github/actions/toolchain

      - name: shellcheck
        env:
          VERSION: v0.11.0
          SHA256: 8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198
        run: |
          command -v shellcheck >/dev/null && exit 0
          tarball="$RUNNER_TEMP/shellcheck.tar.xz"
          curl -fsSL -o "$tarball" "https://github.com/koalaman/shellcheck/releases/download/$VERSION/shellcheck-$VERSION.linux.x86_64.tar.xz"
          echo "$SHA256  $tarball" | sha256sum -c -
          tar -xJf "$tarball" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/shellcheck-$VERSION" >> "$GITHUB_PATH"

      - run: npm ci

      - run: npm run lint

  test:
    needs: runner
    strategy:
      fail-fast: false
      matrix:
        os: ${{ github.event_name != 'push' && fromJSON('["ubuntu-latest","windows-latest"]') || fromJSON('["ubuntu-latest","macos-latest","windows-latest"]') }}
    runs-on: ${{ matrix.os == 'ubuntu-latest' && needs.runner.outputs.runner || matrix.os }}
    timeout-minutes: 20
    env:
      LEFTHOOK: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm

      - uses: ./.github/actions/toolchain

      - run: cargo install wasm-bindgen-cli@0.2.129

      - run: npm ci

      - run: npm run build:wasm

      - run: npm run build:oauth-wasm

      - run: npm test

  reproducible-wasm:
    needs: runner
    runs-on: ${{ needs.runner.outputs.runner }}
    timeout-minutes: 15
    env:
      LEFTHOOK: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm

      - uses: ./.github/actions/toolchain

      - run: cargo install wasm-bindgen-cli@0.2.129

      - run: npm ci

      - name: Build jerk-oauth wasm (first)
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/target-a
        run: |
          npm run build:oauth-wasm
          mkdir -p /tmp/build-a
          cp dist/jerk-oauth/jerk_oauth_wasm_bg.wasm dist/jerk-oauth/jerk_oauth_wasm.js dist/jerk-oauth/jerk_oauth_wasm.d.ts /tmp/build-a/

      - name: Build jerk-oauth wasm (second, from a fresh target dir)
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/target-b
        run: |
          test ! -e "$CARGO_TARGET_DIR"
          npm run build:oauth-wasm
          mkdir -p /tmp/build-b
          cp dist/jerk-oauth/jerk_oauth_wasm_bg.wasm dist/jerk-oauth/jerk_oauth_wasm.js dist/jerk-oauth/jerk_oauth_wasm.d.ts /tmp/build-b/

      - name: Compare builds
        run: |
          diff /tmp/build-a/jerk_oauth_wasm_bg.wasm /tmp/build-b/jerk_oauth_wasm_bg.wasm
          diff /tmp/build-a/jerk_oauth_wasm.js /tmp/build-b/jerk_oauth_wasm.js
          diff /tmp/build-a/jerk_oauth_wasm.d.ts /tmp/build-b/jerk_oauth_wasm.d.ts
          echo "All jerk-oauth wasm artifacts are byte-identical across builds"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: jerk-oauth-reproducible
          path: /tmp/build-a/
          retention-days: 7

  test-installer:
    needs: runner
    runs-on: ${{ needs.runner.outputs.runner }}
    timeout-minutes: 10
    env:
      LEFTHOOK: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Create fake assets
        run: |
          mkdir -p _test_assets
          arch=$(uname -m)
          case "$arch" in x86_64|amd64) arch=amd64 ;; arm64|aarch64) arch=arm64 ;; esac
          asset="jerk-linux-${arch}"
          printf '#!/bin/sh\nprintf "jerk 0.99.0\\n"\n' > "_test_assets/$asset"
          chmod +x "_test_assets/$asset"
          hash=$(sha256sum "_test_assets/$asset" | cut -d' ' -f1)
          printf '%s  %s\n' "$hash" "$asset" > _test_assets/SHA256SUMS

      - name: Run installer tests
        run: FAKE_VERSION=0.99.0 sh scripts/test-install.sh _test_assets

  test-installer-macos:
    if: github.event_name == 'push'
    runs-on: macos-latest
    timeout-minutes: 10
    env:
      LEFTHOOK: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Create fake assets
        run: |
          mkdir -p _test_assets
          os=$(uname -s | tr '[:upper:]' '[:lower:]')
          case "$(uname -m)" in x86_64|amd64) arch=amd64 ;; arm64|aarch64) arch=arm64 ;; esac
          asset="jerk-${os}-${arch}"
          printf '#!/bin/sh\nprintf "jerk 0.99.0\\n"\n' > "_test_assets/$asset"
          chmod +x "_test_assets/$asset"
          hash=$(shasum -a 256 "_test_assets/$asset" | cut -d' ' -f1)
          printf '%s  %s\n' "$hash" "$asset" > _test_assets/SHA256SUMS

      - name: Run installer tests
        run: FAKE_VERSION=0.99.0 sh scripts/test-install.sh _test_assets

  test-installer-alpine:
    needs: runner
    runs-on: ${{ needs.runner.outputs.runner }}
    timeout-minutes: 10
    env:
      LEFTHOOK: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Create fake assets
        run: |
          mkdir -p _test_assets
          arch=$(uname -m)
          case "$arch" in x86_64|amd64) arch=amd64 ;; arm64|aarch64) arch=arm64 ;; esac
          asset="jerk-linux-${arch}"
          printf '#!/bin/sh\nprintf "jerk 0.99.0\\n"\n' > "_test_assets/$asset"
          chmod +x "_test_assets/$asset"
          hash=$(sha256sum "_test_assets/$asset" | cut -d' ' -f1)
          printf '%s  %s\n' "$hash" "$asset" > _test_assets/SHA256SUMS

      - name: Run installer tests in alpine (wget only)
        env:
          SCRIPT: |
            apk add --no-cache python3 coreutils
            apk del curl 2>/dev/null || true
            FAKE_VERSION=0.99.0 sh /w/scripts/test-install.sh /w/_test_assets
        run: |
          if docker info >/dev/null 2>&1; then
            docker run --rm -v "$PWD:/w" -e SCRIPT alpine:latest sh -c "$SCRIPT"
            exit 0
          fi
          base="https://dl-cdn.alpinelinux.org/alpine/latest-stable/releases/$(uname -m)"
          releases=$(curl -fsSL "$base/latest-releases.yaml")
          entry=$(printf '%s\n' "$releases" | awk '/flavor: alpine-minirootfs/{f=1} f&&/file:/{file=$2} f&&/sha256:/{print file, $2; exit}')
          file=${entry% *}
          sha=${entry#* }
          curl -fsSL -o "$RUNNER_TEMP/$file" "$base/$file"
          echo "$sha  $RUNNER_TEMP/$file" | sha256sum -c -
          rootfs="$RUNNER_TEMP/alpine"
          mkdir -p "$rootfs"
          tar -xzf "$RUNNER_TEMP/$file" -C "$rootfs"
          cp /etc/resolv.conf "$rootfs/etc/resolv.conf"
          mkdir -p "$rootfs/w"
          unshare -rm sh -c 'mount --rbind /dev "$1/dev" && mount --rbind /proc "$1/proc" && mount --bind "$PWD" "$1/w" && chroot "$1" /bin/sh -c "$SCRIPT"' sh "$rootfs"

  ci:
    if: always()
    needs: [runner, lint, test, reproducible-wasm, test-installer, test-installer-macos, test-installer-alpine]
    runs-on: ${{ needs.runner.outputs.runner || 'ubuntu-latest' }}
    timeout-minutes: 5
    steps:
      - name: Every required job passed or was skipped
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "$RESULTS"
          for r in $RESULTS; do
            case "$r" in success|skipped) ;; *) exit 1 ;; esac
          done
