name: Release

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name == 'pull_request' && github.ref || 'main' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  plan:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      LEFTHOOK: '0'
    outputs:
      version: ${{ steps.plan.outputs.version }}
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Plan
        id: plan
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/release-plan.mjs

      - name: Matrix
        id: matrix
        run: node scripts/build-matrix.mjs

  dry-run:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.plan.outputs.version }}
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Plan
        id: plan
        run: echo "version=0.0.0-dry-run.$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"

      - name: Matrix
        id: matrix
        run: node scripts/build-matrix.mjs --pull-request

  build:
    needs: [plan, dry-run]
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') && (needs.plan.outputs.version || needs.dry-run.outputs.version) != '' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix || needs.dry-run.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    env:
      JERK_VERSION: ${{ needs.plan.outputs.version || needs.dry-run.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Toolchain
        shell: bash
        run: |
          if ! command -v rustup >/dev/null; then
            curl --proto '=https' --tlsv1.2 -fsSL https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
            export PATH="$HOME/.cargo/bin:$PATH"
          fi
          rustup toolchain install
          for build in ${{ matrix.builds }}; do rustup target add "${build%%:*}"; done

      - name: musl C toolchain
        if: contains(matrix.builds, 'musl')
        run: sudo apt-get update -qq && sudo apt-get install -y -qq musl-tools

      - name: Build
        shell: bash
        run: |
          mkdir -p out
          for build in ${{ matrix.builds }}; do
            IFS=: read -r target file asset <<< "$build"
            cargo build --release --locked --target "$target" -p jerk
            cp "target/$target/release/$file" "out/$asset"
          done

      - name: Sign and notarize the darwin binaries
        if: matrix.name == 'darwin' && github.event_name != 'pull_request'
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DEVELOPER_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_KEY_ISSUER_ID: ${{ secrets.APPLE_API_KEY_ISSUER_ID }}
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
        run: scripts/sign-macos.sh out/jerk-darwin-arm64 out/jerk-darwin-amd64

      - name: Sign the windows binaries
        if: startsWith(matrix.name, 'windows') && github.event_name != 'pull_request'
        shell: bash
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TRUSTED_SIGNING_ENDPOINT: ${{ secrets.AZURE_TRUSTED_SIGNING_ENDPOINT }}
          AZURE_TRUSTED_SIGNING_ACCOUNT: ${{ secrets.AZURE_TRUSTED_SIGNING_ACCOUNT }}
          AZURE_TRUSTED_SIGNING_PROFILE: ${{ secrets.AZURE_TRUSTED_SIGNING_PROFILE }}
        run: scripts/sign-windows.sh out/*.exe

      - name: Check the version
        if: matrix.name != 'wasm'
        shell: bash
        run: |
          first="${{ matrix.builds }}"
          first="${first%% *}"
          test "$("out/${first##*:}" --version)" = "jerk $JERK_VERSION"

      - name: Assert Linux binaries are static
        if: matrix.name == 'linux'
        shell: bash
        run: |
          for f in out/jerk-linux-*; do
            info=$(file "$f")
            printf '%s: %s\n' "$f" "$info"
            echo "$info" | grep -qi 'static' || { printf 'FAIL: %s is not statically linked\n' "$f" >&2; exit 1; }
          done

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: jerk-${{ matrix.name }}
          path: out/
          retention-days: 7

  package-check:
    needs: [dry-run, build]
    if: ${{ !cancelled() && needs.build.result == 'success' && github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      LEFTHOOK: '0'
      VERSION: ${{ needs.dry-run.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: rustup show active-toolchain || rustup toolchain install

      - run: cargo install wasm-bindgen-cli@0.2.129

      - run: npm run build:oauth-wasm

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          path: artifacts/build

      - run: node scripts/release-collect.mjs --version "$VERSION" --skip-missing

      - run: node scripts/npm-stage.mjs --version "$VERSION" --only linux-arm64 --only linux-x64 --only win32-arm64 --only win32-x64

      - run: node scripts/npm-publish.mjs --dry-run

  release:
    needs: [plan, build]
    if: ${{ !cancelled() && needs.build.result == 'success' && github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
      attestations: write
    env:
      LEFTHOOK: '0'
      VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: rustup show active-toolchain || rustup toolchain install

      - run: cargo install wasm-bindgen-cli@0.2.129

      - run: npm run build:oauth-wasm

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          path: artifacts/build

      - run: node scripts/release-collect.mjs --version "$VERSION"

      - run: node scripts/npm-stage.mjs --version "$VERSION"

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-checksums: artifacts/release/SHA256SUMS

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SLICC_NPM_PUBLISH: ${{ vars.SLICC_NPM_PUBLISH }}
        run: npx semantic-release

  smoke-installer:
    needs: [release]
    if: ${{ !cancelled() && needs.release.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Install via one-liner
        run: curl -fsSL https://github.com/ai-ecoverse/slicc-jerk/releases/latest/download/install.sh | sh

      - name: Verify
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          jerk --version

  reproduce-jerk-oauth:
    needs: [plan, release]
    if: ${{ !cancelled() && needs.release.result == 'success' && needs.plan.outputs.version != '' && vars.SLICC_NPM_PUBLISH == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      LEFTHOOK: '0'
      VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: v${{ needs.plan.outputs.version }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: rustup show active-toolchain || rustup toolchain install

      - run: cargo install wasm-bindgen-cli@0.2.129

      - name: Rebuild from the tag in a fresh target dir
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/target-fresh
        run: npm run build:oauth-wasm

      - name: Compare with the published package
        run: |
          mkdir -p "$RUNNER_TEMP/published"
          npm pack "@ai-ecoverse/jerk-oauth@$VERSION" --pack-destination "$RUNNER_TEMP/published"
          tar -xzf "$RUNNER_TEMP"/published/*.tgz -C "$RUNNER_TEMP/published"
          for f in jerk_oauth_wasm_bg.wasm jerk_oauth_wasm.js jerk_oauth_wasm.d.ts; do
            cmp "dist/jerk-oauth/$f" "$RUNNER_TEMP/published/package/$f"
          done

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: jerk-oauth-rebuild-${{ needs.plan.outputs.version }}
          path: dist/jerk-oauth/
          retention-days: 30
