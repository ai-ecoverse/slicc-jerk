name: Toolchain
description: Rust from rust-toolchain.toml, plus the C toolchain the vendored OpenSSL build needs on Linux
runs:
  using: composite
  steps:
    - name: Rust
      shell: bash
      run: |
        if ! command -v rustup >/dev/null; then
          curl --proto '=https' --tlsv1.2 -fsSL https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.cargo/bin:$PATH"
        fi
        rustup show active-toolchain || rustup toolchain install

    - name: C toolchain
      if: runner.os == 'Linux'
      shell: bash
      run: |
        missing=
        for tool in cc make perl; do command -v "$tool" >/dev/null || missing=1; done
        if [ -n "$missing" ]; then
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends build-essential perl
        fi
