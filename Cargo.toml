[workspace]
resolver = "2"
members = ["crates/jerk", "crates/jerk-core", "crates/jerk-oauth"]

[workspace.package]
version = "0.0.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/ai-ecoverse/slicc-jerk"

[workspace.lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(jerk_unit)"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
